[workspace]
members  = ["crates/*"]
resolver = "3"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"
# Explicit, not just the default: `panic_guard.rs`'s `catch_unwind` around
# `call_tool` is a no-op under `panic = "abort"`, and abort would turn a
# contained tool panic into a process kill. Do not change this without
# removing that containment too.
panic         = "unwind"

[workspace.package]
version      = "0.9.0"
edition      = "2024"
rust-version = "1.96"          # raised from rmcp 3.x's 1.88 floor; see docs/adr/0003
license      = "MIT"
repository   = "https://github.com/mimi1vx/ruprogress-mcp"

[workspace.dependencies]
redmine-client = { path = "crates/redmine-client", version = "0.9.0" }
rmcp        = { version = "=3.1.1", default-features = false }
tokio       = { version = "1.53",  default-features = false }
reqwest     = { version = "0.13",  default-features = false, features = ["json", "stream", "rustls", "form"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
schemars    = "1.2"
thiserror   = "2"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
axum        = "0.8"
# Held at 0.6 deliberately: reqwest 0.13 depends on `tower-http ^0.6.8`, so
# asking for 0.7 here resolves to two copies of the crate in every build.
tower-http  = { version = "0.6", default-features = false }
secrecy     = "0.10"
url         = "2.5"
chrono      = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid        = { version = "1", features = ["v4"] }
clap        = { version = "4", features = ["derive"] }
tokio-util  = "0.7"
rand        = "0.9"
dotenvy     = "0.15"
http        = "1"
bytes       = "1"
wiremock    = "0.6"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64      = "0.22"
sha2        = "0.11"
criterion   = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code                    = "forbid"
missing_debug_implementations  = "warn"
unreachable_pub                = "warn"
rust_2018_idioms               = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic                 = { level = "warn", priority = -1 }
unwrap_used              = "deny"
expect_used              = "deny"
panic                    = "deny"
indexing_slicing         = "deny"
arithmetic_side_effects  = "warn"
todo                     = "deny"
dbg_macro                = "deny"
print_stdout             = "deny"   # stdio transport owns stdout; a stray print corrupts the JSON-RPC stream
