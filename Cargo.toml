[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.96"          # raised from rmcp 3.x's 1.88 floor; see docs/adr/0003
license      = "MIT"
repository   = "https://github.com/mimi1vx/ruprogress-mcp"

[workspace.dependencies]
rmcp        = { version = "=3.1.1", default-features = false }
tokio       = { version = "1.53",  default-features = false }
reqwest     = { version = "0.13",  default-features = false, features = ["json", "stream", "rustls"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
schemars    = "1.2"
thiserror   = "2"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
axum        = "0.8"
tower-http  = { version = "0.7", default-features = false }
secrecy     = "0.10"
url         = "2.5"
chrono      = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid        = { version = "1", features = ["v4"] }
clap        = { version = "4", features = ["derive"] }
tokio-util  = "0.7"
rand        = "0.9"
dotenvy     = "0.15"
http        = "1"
bytes       = "1"
wiremock    = "0.6"

[workspace.lints.rust]
unsafe_code                    = "forbid"
missing_debug_implementations  = "warn"
unreachable_pub                = "warn"
rust_2018_idioms               = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic                 = { level = "warn", priority = -1 }
unwrap_used              = "deny"
expect_used              = "deny"
panic                    = "deny"
indexing_slicing         = "deny"
arithmetic_side_effects  = "warn"
todo                     = "deny"
dbg_macro                = "deny"
print_stdout             = "deny"   # stdio transport owns stdout; a stray print corrupts the JSON-RPC stream
