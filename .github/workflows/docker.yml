name: docker

# A separate workflow (not a ci.yml job) so it can carry its own `paths:`
# filter — a build this slow has no business running on every PR, only on
# the ones that can actually change the image. The weekly schedule catches
# base-image rot between those pushes.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - crates/**
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - crates/**
  schedule:
    - cron: "0 6 * * 1" # weekly, for base-image rot
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ruprogress-mcp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # distroless has no shell, so `--help` is the cheapest "does the
      # dynamic loader resolve" probe — the check that would have caught a
      # builder/runtime glibc mismatch.
      - name: Loader smoke test
        run: docker run --rm ruprogress-mcp:smoke --help
      - name: Start the server
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            -e PUBLIC_HOST=localhost \
            -e REDMINE_MCP_ALLOW_UNAUTHENTICATED_NETWORK=true \
            -e REDMINE_URL=https://redmine.example.com \
            -e REDMINE_API_KEY=smoke-test \
            ruprogress-mcp:smoke
      # Exercises the full runtime, including the CA bundle the
      # rustls-platform-verifier needs from the base image.
      - name: Healthcheck
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            docker exec smoke /usr/local/bin/ruprogress-mcp --healthcheck && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1
      - name: Container logs
        if: always()
        run: docker logs smoke
