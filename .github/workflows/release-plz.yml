name: release-plz

on:
  push:
    branches: [main]

jobs:
  # Tag + GitHub Release for merged release PRs. `cargo publish` itself
  # happens via OIDC in release.yml (release-plz.toml sets `publish = false`).
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `releases` has two entries (ruprogress-mcp + redmine-client) since
      # this is a two-crate workspace; only ruprogress-mcp carries a tag
      # (release-plz.toml pins git_tag_enable to it alone), so select by
      # name rather than assuming index [0]. Empty when this push released
      # nothing (releases_created == false) or only bumped redmine-client.
      - id: tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          printf 'tag=%s\n' \
            "$(jq -r '.[] | select(.package_name=="ruprogress-mcp") | .tag' <<<"$RELEASES")" \
            >> "$GITHUB_OUTPUT"

  # The tag release-plz just pushed used GITHUB_TOKEN, so it raises no `push`
  # or `release` event of its own — call the publish workflow explicitly.
  publish:
    name: publish to crates.io
    needs: release-plz-release
    if: needs.release-plz-release.outputs.tag != ''
    permissions:
      id-token: write
      contents: write # assets job (in release.yml) needs to upload assets — caller-capped
      packages: write # container/container-manifest jobs (in release.yml) push to ghcr.io — caller-capped
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.release-plz-release.outputs.tag }}

  # Opens/updates the release PR with version bumps and changelog.
  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
