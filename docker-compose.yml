services:
  ruprogress-mcp:
    build: .
    image: ruprogress-mcp:dev
    ports:
      - "8000:8000"
    environment:
      REDMINE_URL: https://redmine.example.com
      REDMINE_API_KEY: ${REDMINE_API_KEY}
      # Required: the image already sets SERVER_HOST=0.0.0.0, and a
      # non-loopback bind with no PUBLIC_HOST is a startup error — see
      # docs/configuration.md#exposing-the-server-on-a-network.
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}

      # Rate limiting (9.2) defaults — uncomment to override.
      # REDMINE_MCP_RATE_LIMIT_ENABLED: "true"
      # REDMINE_MCP_RATE_LIMIT_RPS: "10"
      # REDMINE_MCP_RATE_LIMIT_BURST: "40"
      # REDMINE_MCP_RATE_LIMIT_AUTH_RPS: "1"
      # REDMINE_MCP_RATE_LIMIT_AUTH_BURST: "10"
      # REDMINE_MCP_RATE_LIMIT_MAX_KEYS: "10000"
    volumes:
      - attachments:/var/lib/ruprogress-mcp/attachments
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/ruprogress-mcp", "--healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    # `/livez` (the image's own HEALTHCHECK) only proves the process is
    # alive, never Redmine — an orchestrator readiness probe should point at
    # GET /readyz instead, which does check Redmine and is deliberately kept
    # out of the container-level HEALTHCHECK (see Dockerfile).

volumes:
  attachments:
