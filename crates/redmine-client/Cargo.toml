[package]
name          = "redmine-client"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
description   = "A pure Redmine REST client: no MCP, no LLM shaping — just typed requests and responses."
readme        = "README.md"
homepage      = "https://github.com/mimi1vx/ruprogress-mcp/tree/main/crates/redmine-client"
documentation = "https://docs.rs/redmine-client"
keywords      = ["redmine", "rest-client", "http-client"]
categories    = ["web-programming::http-client", "api-bindings"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
reqwest    = { workspace = true }
thiserror  = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
url        = { workspace = true }
chrono     = { workspace = true }
http       = { workspace = true }
bytes      = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
rand       = { workspace = true }
secrecy    = { workspace = true }
tracing    = { workspace = true }
tokio      = { workspace = true, features = ["time"] }

[dev-dependencies]
wiremock = { workspace = true }
tokio    = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
tracing-subscriber = { workspace = true }
