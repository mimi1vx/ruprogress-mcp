[package]
name         = "ruprogress-mcp"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
# The deployable binary, not a library for crates.io: never published, so a
# workspace path dependency on redmine-client needs no version pin.
publish      = false

[lints]
workspace = true

[dependencies]
redmine-client = { path = "../redmine-client" }
rmcp        = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio       = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
clap        = { workspace = true }
dotenvy     = { workspace = true }
secrecy     = { workspace = true }
url         = { workspace = true }
rand        = { workspace = true }

[dev-dependencies]
rmcp     = { workspace = true, features = ["client"] }
wiremock = { workspace = true }
