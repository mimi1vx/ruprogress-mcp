[package]
name          = "ruprogress-mcp"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
description   = "A Redmine MCP server: stdio/HTTP tools, four auth modes, read-only mode, bounded responses, and a local attachment store."
readme        = "README.md"
homepage      = "https://github.com/mimi1vx/ruprogress-mcp"
documentation = "https://docs.rs/ruprogress-mcp"
keywords      = ["mcp", "redmine", "api-bindings", "server"]
categories    = ["command-line-utilities", "api-bindings", "development-tools"]
# `tests/tool_reference_doc.rs` reads `docs/tool-reference.md` from the repo
# root, outside this package — it cannot pass from the `.crate` alone.
exclude       = ["/tests"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
redmine-client = { workspace = true }
rmcp        = { workspace = true, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio       = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "fs", "io-util"] }
tokio-util  = { workspace = true, features = ["rt", "io"] }
futures-util = { workspace = true }
base64      = { workspace = true }
uuid        = { workspace = true, features = ["serde"] }
axum        = { workspace = true }
tower-http  = { workspace = true, features = ["cors", "trace", "timeout", "set-header"] }
http        = { workspace = true }
bytes       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
schemars    = { workspace = true, features = ["chrono04"] }
thiserror   = { workspace = true }
anyhow      = { workspace = true }
chrono      = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
clap        = { workspace = true }
dotenvy     = { workspace = true }
secrecy     = { workspace = true }
url         = { workspace = true }
rand        = { workspace = true }
sha2        = { workspace = true }
# Real dependency, not dev-only: `--healthcheck` (main.rs) GETs /livez itself,
# since distroless has no shell/curl for the container HEALTHCHECK to run.
reqwest     = { workspace = true }

[dev-dependencies]
rmcp     = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
wiremock = { workspace = true }
criterion = { workspace = true }

[[bench]]
name    = "output_caps"
harness = false

[[bench]]
name    = "ratelimit"
harness = false
